<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus Guard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f131a;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}.sub{color:#9ca5b5;font-size:12px;margin-top:3px}
button{min-height:44px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:#2e7cf6;color:white}
button.secondary{background:#303846}button:disabled{opacity:.55}
.setup,.panel{background:#171c25;border-radius:18px;padding:16px}.setup{margin-bottom:14px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#aeb8c7;font-size:12px;margin-bottom:5px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333b49;background:#0f131a;color:white;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 260px;gap:14px}
.camera{position:relative;background:#05070a;border-radius:18px;overflow:hidden;aspect-ratio:16/10;min-height:280px}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.overlay{position:absolute;left:12px;top:12px;background:#0009;padding:8px 10px;border-radius:10px;font-size:13px}
.timer{font-size:42px;font-weight:800;letter-spacing:1px;margin:3px 0}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#263041;color:#b9c4d4;font-size:12px}
.danger{background:#54242a;color:#ffb6bd}.log{margin-top:14px;max-height:220px;overflow:auto}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #282e39;padding:9px 0;font-size:13px}.muted{color:#9ca5b5;font-size:12px;line-height:1.5}
@media(max-width:750px){.grid{grid-template-columns:1fr}.camera{aspect-ratio:4/3}.inputs{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Focus Guard</h1><div class="sub">집중 시간에는 감지하고, 쉬는 시간에는 카메라를 자동으로 끕니다.</div></div></div>

<section class="setup">
<div class="inputs">
<div class="field"><label for="work">집중 시간(분)</label><input id="work" type="number" min="1" max="180" value="25"></div>
<div class="field"><label for="rest">쉬는 시간(분)</label><input id="rest" type="number" min="1" max="60" value="5"></div>
</div>
<div class="actions">
<button id="start" type="button">집중 시작</button>
<button id="reset" type="button" class="secondary">초기화</button>
</div>
<p id="help" class="muted">처음 시작하면 브라우저가 카메라 사용 권한을 요청합니다. 허용하면 집중 시간 동안 카메라 감지가 실행됩니다.</p>
</section>

<div class="grid">
<div class="camera">
<video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas>
<div id="status" class="overlay">집중 시작을 눌러 주세요.</div>
</div>
<aside class="panel">
<div class="muted">현재 세션</div><div id="phase">대기</div>
<div id="timer" class="timer">25:00</div>
<div class="muted">누적 경고</div><div id="count" class="timer" style="font-size:34px">0</div>
<span id="reason" class="badge">대기 중</span>
<div id="log" class="log"><div class="row"><span>아직 경고가 없습니다.</span><small>—</small></div></div>
</aside>
</div>
</main>

<script type="module">
const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d");
let stream=null,landmarker=null,running=false,phase="idle",timerId=null,raf=null;
let endAt=0,warnings=0,lastWarn=0,closedSince=0,awaySince=0,nodSince=0,loading=false;

function status(t){$("status").textContent=t}
function stopCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height)
}
function beep(){
  try{const A=AudioContext||webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=880;o.type="square";g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.18,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.17);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.18)}catch(e){}
}
function warn(reason){
  const n=Date.now();if(n-lastWarn<2500)return;lastWarn=n;warnings++;
  $("count").textContent=warnings;$("reason").textContent=reason;$("reason").className="badge danger";beep();
  const row=document.createElement("div");row.className="row";
  row.innerHTML="<span>"+reason+"</span><small>"+new Date().toLocaleTimeString("ko-KR")+"</small>";
  if($("log").children.length===1 && $("log").textContent.includes("아직"))$("log").innerHTML="";
  $("log").prepend(row)
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function eyeRatio(f){
 const e=(a,b,c,d,m,n)=>(dist(f[a],f[b])+dist(f[c],f[d]))/(2*dist(f[m],f[n]));
 return (e(160,144,158,153,33,133)+e(385,380,387,373,362,263))/2
}
function analyze(f,now){
 const eye=eyeRatio(f),nose=f[1],l=f[234],r=f[454],w=Math.max(.001,dist(l,r));
 const centered=Math.abs((nose.x-(l.x+r.x)/2)/w),eyeY=(f[33].y+f[263].y)/2,down=(nose.y-eyeY)/w;
 if(eye<.19){if(!closedSince)closedSince=now}else closedSince=0;
 if(centered>.45){if(!awaySince)awaySince=now}else awaySince=0;
 if(down>.48){if(!nodSince)nodSince=now}else nodSince=0;
 if(closedSince&&now-closedSince>1400){warn("눈 감김");closedSince=now+999999}
 else if(awaySince&&now-awaySince>1600){warn("얼굴 이탈");awaySince=now+999999}
 else if(nodSince&&now-nodSince>1700){warn("고개 숙임");nodSince=now+999999}
}
function loop(){
 if(!running||phase!=="work")return;
 if(video.readyState>=2&&landmarker){
  const res=landmarker.detectForVideo(video,performance.now());
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);
  if(res.faceLandmarks?.length){const f=res.faceLandmarks[0];ctx.strokeStyle="#43e0a1";ctx.lineWidth=2;
   for(const p of f){ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,1.2,0,Math.PI*2);ctx.stroke()}
   analyze(f,Date.now());status("집중 감지 중")
  }else status("얼굴을 찾는 중...")
 }
 raf=requestAnimationFrame(loop)
}
async function loadModel(){
 if(landmarker)return;
 status("얼굴 인식 모델을 준비 중...");
 const v=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs");
 const fs=await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
 landmarker=await v.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1})
}
function showTime(ms){const s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60),x=s%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function startRest(){
 phase="rest";stopCamera();$("phase").textContent="쉬는 시간";status("쉬는 시간 — 카메라가 꺼져 있습니다.");
 const mins=Math.max(1,Math.min(60,Number($("rest").value)||5));endAt=Date.now()+mins*60000;clearInterval(timerId);
 timerId=setInterval(()=>{const left=endAt-Date.now();showTime(left);if(left<=0){clearInterval(timerId);startWork()}},250)
}
async function startWork(){
 phase="work";$("phase").textContent="집중 시간";$("start").disabled=true;status("카메라 권한을 요청하는 중...");
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("CAMERA_UNSUPPORTED");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();await loadModel();
  const mins=Math.max(1,Math.min(180,Number($("work").value)||25));endAt=Date.now()+mins*60000;
  clearInterval(timerId);timerId=setInterval(()=>{const left=endAt-Date.now();showTime(left);
   if(left<=0){clearInterval(timerId);startRest()}},250);
  running=true;status("집중 감지 중");loop()
 }catch(e){
  stopCamera();phase="idle";$("phase").textContent="시작 실패";$("start").disabled=false;
  status(e.name==="NotAllowedError"?"카메라 권한이 거부되었습니다. Chrome 사이트 설정에서 카메라를 허용해 주세요.":e.message==="CAMERA_UNSUPPORTED"?"HTTPS 웹사이트에서 실행해야 카메라를 사용할 수 있습니다.":"카메라를 시작하지 못했습니다: "+e.message)
 }
}
$("start").addEventListener("click",async()=>{
 if(loading)return;loading=true;warnings=0;$("count").textContent="0";$("reason").textContent="대기 중";
 if(phase==="idle"){await startWork()}else{clearInterval(timerId);running=false;cancelAnimationFrame(raf);stopCamera();phase="idle";$("phase").textContent="대기";showTime((Number($("work").value)||25)*60000);$("start").textContent="집중 시작";status("중지되었습니다.")}
 $("start").disabled=false;loading=false
});
$("reset").addEventListener("click",()=>{clearInterval(timerId);running=false;cancelAnimationFrame(raf);stopCamera();phase="idle";warnings=0;$("count").textContent="0";$("phase").textContent="대기";$("start").textContent="집중 시작";$("reason").textContent="대기 중";showTime((Number($("work").value)||25)*60000);status("집중 시작을 눌러 주세요.")});
showTime(25*60000);
</script>
</body>
</html>
